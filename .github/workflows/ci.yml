name: CI

# Runs on every push and pull request:
#   tests   - backend tests on SQLite and on PostgreSQL 16, frontend type check + build
#   docker  - builds docker-compose, starts the whole stack, runs scripts/smoke_test.sh
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc
          POSTGRES_DB: hcc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hcc" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backend tests (SQLite)
        run: python -m pytest -q
      - name: Backend tests (PostgreSQL, as in docker-compose)
        env:
          HCC_TEST_DATABASE_URL: postgresql+psycopg://hcc:hcc@localhost:5432/hcc
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests, type check and build
        working-directory: frontend
        run: npm ci && npm test && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Smoke test through nginx (port 8080)
        run: bash scripts/smoke_test.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
