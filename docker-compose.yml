services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hcc
      POSTGRES_PASSWORD: hcc
      POSTGRES_DB: hcc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcc"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HCC_DATABASE_URL: postgresql+psycopg://hcc:hcc@db:5432/hcc
      HCC_STORAGE_DIR: /data/storage
      HCC_DETECTOR: ${HCC_DETECTOR:-heuristic}
      HCC_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  storage:
